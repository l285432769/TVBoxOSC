name: Test
on:
  schedule:
    - cron: 59 6 * * *
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略构建记录以重新构建'
        required: false
        type: boolean
      donotpublish:
        description: '构建后不提交发布新版'
        required: false
        type: boolean

jobs:
  telegram-bot-api:
    name: Telegram Bot API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Telegram Bot API
        run: |
          git clone --recursive https://github.com/tdlib/telegram-bot-api.git
          git status telegram-bot-api >> telegram-bot-api-status

      - name: Cache Bot API Binary
        id: cache-bot-api
        uses: actions/cache@v4
        with:
          path: telegram-bot-api-binary
          key: CI-telegram-bot-api-${{ hashFiles('telegram-bot-api-status') }}

      - name: Compile Telegram Bot API
        if: steps.cache-bot-api.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install make git zlib1g-dev libssl-dev gperf cmake g++
          cd telegram-bot-api
          rm -rf build
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=.. ..
          cmake --build . --target install -j$(nproc)
          cd ../..
          cp telegram-bot-api/bin/telegram-bot-api telegram-bot-api-binary

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-api-binary
          path: telegram-bot-api-binary

  build:
    needs: telegram-bot-api
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: l285432769
            repoName: TVBoxOS
            branchName: main
          - userName: l285432769
            repoName: Box
            branchName: main
            java_ver: 11 # Box 仓库强制 Java 11 以免 AGP 不兼容
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check New Commit
        run: |
          upStream=https://github.com/${{ matrix.userName }}/${{ matrix.repoName }}
          echo "upStream=$upStream" >> $GITHUB_ENV
          commit=$(curl -s "https://api.github.com/repos/${{ matrix.userName }}/${{ matrix.repoName }}/commits/${{ matrix.branchName }}?per_page=1" | jq -r '.sha' )
          if [[ -z "${commit}" || "${commit}" == "null" ]]; then
              commit=$(curl -sL $upStream/commits/${{ matrix.branchName }} |grep -o "/${{ matrix.userName }}/${{ matrix.repoName }}/commit/[a-z0-9]\+" |head -1 | cut -d\/ -f5)
          fi
          if ! grep -q "$commit" README.md || [ "${{ github.event.inputs.rebuild }}" == "true" ]; then
            echo "commit=$commit" >> $GITHUB_ENV
            echo "commitS=${commit:0:7}" >> $GITHUB_ENV
          fi
          echo "commit=$commit"

      - name: Checkout Source Code
        if: ${{ env.commit }}
        run: |
          git clone ${{ env.upStream }} TVBoxOSC
          cd TVBoxOSC
          git checkout ${{ env.commit }}
          echo "tag=$(git log --date=format:'%Y%m%d-%H%M' --pretty=format:%cd ${{ env.commitS }} -1)" >> $GITHUB_ENV

      - name: Extra Modify
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo '修改VersionName'
          if [ -f app/build.gradle ]; then
            if [ "${{ matrix.userName }}" == "takagen99" ]; then
              sed -i 's/\.concat(buildTime())/ +\"${{ env.tag }}\"/g' app/build.gradle || true
            else
              if grep -q 'versionName' app/build.gradle; then
                sed -i "/versionName/s#[0-9a-zA-Z_\.\'\"-]\+\$#\'${{ env.tag }}\'#" app/build.gradle || true
              fi
            fi
          fi
          if [ -f app/src/main/res/layout/dialog_about.xml ]; then
            sed -i "/android:text=/s#=\"#=\"${{ env.tag }}\\\\n\\\\n#" app/src/main/res/layout/dialog_about.xml || true
          fi
          
          echo 'crosswalk源，防挂'
          if [ -f build.gradle ]; then
            if grep -q 'crosswalk' build.gradle; then
              sed -i "/crosswalk/a\        maven { url 'https://j4uq.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle || true
            else
              sed -i "/jitpack.io/a\        maven { url 'https://j4uq.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle || true
            fi
          fi
          
          if [ -d pyramid ] && [ -f pyramid/requirements.txt ]; then
            sed -i 's/^pyquery$/pyquery==1.4.3/' pyramid/requirements.txt || true
          fi

      - name: Show repo files and Gradle config (Diagnostics)
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          echo "Repository root:"
          ls -la
          echo "Gradle wrapper properties:"
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then cat gradle/wrapper/gradle-wrapper.properties; fi
          echo "settings files:"
          ls -la settings.gradle settings.gradle.kts || true
          echo "If present, show settings.gradle:"
          if [ -f settings.gradle ]; then sed -n '1,200p' settings.gradle; fi
          if [ -f settings.gradle.kts ]; then sed -n '1,200p' settings.gradle.kts; fi
          echo "If present, show app/build.gradle (first 50 lines):"
          if [ -f app/build.gradle ]; then sed -n '1,50p' app/build.gradle; fi

      - name: Compress Source Code
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          tar -cJf sourceCode-${{ env.commitS }}.tar.xz --exclude=.git --exclude=.github * || true

      - name: Setup Python
        if: ${{ env.commit }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Python dependencies
        if: ${{ env.commit }}
        run: |
          python -m pip install --upgrade pip
          pip install lxml ujson pyquery==1.4.3 requests jsonpath cachetools pycryptodome beautifulsoup4

      - name: Modify pyramid——build.gradle
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          if [ -f pyramid/build.gradle ]; then
            sed -i '/buildPython.*python.exe/d' pyramid/build.gradle || true
          fi

      - name: Setup Python local.properties
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: echo "" > local.properties

      - name: Release Apk Sign
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          if [ -f app/build.gradle ]; then
            signingConfigs=''
            signingConfig='ICAgICAgICAgICAgaWYgKHByb2plY3QuaGFzUHJvcGVydHkoIlJFTEVBU0VfU1RPUkVfRklMRSIpKSB7XAogICAgICAgICAgICAgICAgc2lnbmluZ0NvbmZpZyBzaWduaW5nQ29uZmlncy5teUNvbmZpZ1wKICAgICAgICAgICAgfVwK'
            signingConfigs="$(echo "$signingConfigs" |base64 -d )"
            signingConfig="$(echo "$signingConfig" |base64 -d )"
            sed -i -e "/defaultConfig {/i\\$signingConfigs " -e "/debug {/a\\$signingConfig " -e "/release {/a\\$signingConfig " app/build.gradle || true
          fi
          
          if [ -f .github/workflows/TVBoxOSC.jks ]; then
            cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks || true
            sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks'     ./gradle.properties || true
            sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC'            ./gradle.properties || true
            sed -i '$a\RELEASE_STORE_PASSWORD=TVBoxOSC'       ./gradle.properties || true
            sed -i '$a\RELEASE_KEY_PASSWORD=TVBoxOSC'         ./gradle.properties || true
          fi

      - uses: actions/setup-java@v4
        if: ${{ matrix.java_ver }}
        with:
          distribution: temurin
          java-version: ${{ matrix.java_ver }}

      - uses: gradle/actions/setup-gradle@v3
        if: ${{ env.commit }}

      - name: Build With Gradle (with Retry for 502 errors)
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          chmod +x gradlew
          # 使用 --stacktrace --info 打印完整日志，并加入重试机制应对 502 Bad Gateway 网络波动
          set +e
          max_retries=3
          count=0
          until [ $count -ge $max_retries ]
          do
            echo "--- Gradle Build Attempt $((count+1)) of $max_retries ---"
            ./gradlew assembleRelease --build-cache --no-daemon --warning-mode all --stacktrace --info -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"
            if [ $? -eq 0 ]; then
              echo "Gradle Build Succeeded!"
              break
            fi
            count=$((count+1))
            echo "Gradle Build Failed (Attempt $count). Retrying in 10 seconds..."
            sleep 10
          done
          set -e
          if [ $count -ge $max_retries ]; then
            echo "Gradle Build Failed after $max_retries attempts."
            exit 1
          fi

      - name: Prepare App
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          rm -rf apk/
          mkdir -p apk/
          for file in `find ~ -name "*release*.apk" -print`; do
            base=$(basename "$file")
            if [[ "$base" == TVBox_* ]]; then
              new_base=$(echo "$base" | sed "s/release/${{ matrix.userName }}_${{ env.tag }}/")
            else
              new_base="TVBox_${{ matrix.userName }}_${{ env.tag }}.apk"
            fi
            mv "$file" "apk/$new_base"
          done
          mv sourceCode-${{ env.commitS }}.* apk/ 2>/dev/null || true

      - name: Release Note
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        run: |
          lastCommit=$(grep "${{ matrix.userName }}\/${{ matrix.repoName }}" ${{ github.workspace }}/README.md |grep -o '[a-z0-9]\{40\}' || true)
          export LESSCHARSET=utf-8
          echo -e "Credit: [${{ matrix.userName }}](${{ env.upStream }})\nCommit: ${{ env.commit }}\nChangelog:\n\`\`\`" > apk/${{ matrix.userName }}-Release.log
          if [ "${{ env.commit }}" = "${lastCommit}" ]; then
            git log --pretty=format:%B ${{ env.commitS }} -1 |sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' |cat -n |sort -k2,2 -k1,1n |uniq -f1 |sort -k1,1n |cut -f2- >> apk/${{ matrix.userName }}-Release.log || true
          elif [ -n "${lastCommit}" ]; then
            git log --pretty=format:%B ${{ env.commitS }}...${lastCommit:0:7} |sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' |cat -n |sort -k2,2 -k1,1n |uniq -f1 |sort -k1,1n |cut -f2- >> apk/${{ matrix.userName }}-Release.log || true
          fi
          echo -e '\n```' >> apk/${{ matrix.userName }}-Release.log

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        if: ${{ env.commit }}
        with:
          name: ${{ matrix.userName }}-${{ matrix.repoName }}
          path: |
            TVBoxOSC/apk/*

      - name: Whether Or Not to Publish
        if: ${{ github.event.inputs.donotpublish == 'true' && env.commit }}
        run: |
          echo "commit=" > $GITHUB_ENV

      - name: Release and Upload Assets
        uses: ncipollo/release-action@v1
        if: ${{ env.commit }}
        with:
          name: ${{ env.tag }}
          tag: ${{ env.tag }}
          bodyFile: TVBoxOSC/apk/${{ matrix.userName }}-Release.log
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            TVBoxOSC/apk/*.apk
            TVBoxOSC/apk/sourceCode-${{ env.commitS }}.*

      - name: Download Telegram Bot API Binary
        if: ${{ env.commit }}
        uses: actions/download-artifact@v4
        with:
          name: telegram-bot-api-binary
          path: TVBoxOSC

      - name: Post To Telegram
        if: ${{ env.commit }}
        working-directory: TVBoxOSC
        env:
          CHAT_ID: -1001734684817
          TELEGRAM_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -n "${{ secrets.BOT_TOKEN }}" ]; then
            sed -i -e '1s/\[\(.*\)\].*/#\1/' -e 's#\([&"\/]\)#\\\1#g' apk/${{ matrix.userName }}-Release.log || true
            mv -f apk/${{ matrix.userName }}-Release.log caption.txt || true
            chmod +x telegram-bot-api-binary || true
            ./telegram-bot-api-binary --api-id=21724 --api-hash=3e0cb5efcd52300aec5994fdfc5bdc16 --local 2>&1 > /dev/null &
            sleep 8
            mv ../.github/scripts/upload.py ./ || true
            python upload.py || true
          fi

      - name: Push to master
        if: ${{ env.commit }}
        run: |
          rm -rf TVBoxOSC
          git reset --hard
          sed -i '/url =/d' ./.git/config || true
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]"
          git remote set-url --add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git pull --rebase || true
          sed -i "/${{ matrix.userName }}\/${{ matrix.repoName }}/s#Updated: [a-zA-Z0-9]*#Updated: ${{ env.commit }}#" README.md || true
          git add --all
          if git diff --cached --quiet; then
            echo "README无变更，跳过提交推送"
          else
            git commit -m "${{ env.commit }}" || true
            git push -u origin master || true
          fi

  clean:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete older workflow runs and artifacts
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 10
